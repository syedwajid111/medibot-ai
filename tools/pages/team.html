<!--title:Our team – MediBot|js:team-->
<section class="section page-head center">
  <div class="container"><span class="eyebrow" data-i="eyebrow"></span><h1 data-i="title"></h1><p class="lead" data-i="lead"></p></div>
</section>
<section class="section alt pad-sm"><div class="container stats">
  <div class="stat"><b>3</b><span data-i="s1"></span></div><div class="stat"><b>58</b><span data-i="s2"></span></div>
  <div class="stat"><b>64/64</b><span data-i="s3"></span></div><div class="stat"><b>2</b><span data-i="s4"></span></div></div></section>
<section class="section pad"><div class="container"><div class="grid g3" id="members"></div>
  <div class="card card-flat center" style="margin-top:24px" id="supervisor"></div></div></section>
<section class="section alt pad"><div class="container grid g2" style="gap:48px">
  <div><span class="eyebrow" data-i="missionEyebrow"></span><h2 data-i="missionTitle"></h2><p class="lead" data-i="mission"></p><ul class="ticks" data-list="stack"></ul></div>
  <form class="card stack" id="contact"><h2 id="contactTitle" data-i="contactTitle"></h2><span id="contactAnchor"></span>
    <div class="field"><label for="cName" data-i="name"></label><input id="cName" required maxlength="80" autocomplete="name"></div>
    <div class="field"><label for="cEmail" data-i="email"></label><input id="cEmail" type="email" required maxlength="120" autocomplete="email"></div>
    <div class="field"><label for="cMsg" data-i="message"></label><textarea id="cMsg" required minlength="5" maxlength="2000"></textarea></div>
    <p class="form-msg" id="cOut" role="status"></p><button class="btn" data-i="send"></button></form>
</div></section>
