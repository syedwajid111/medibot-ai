<!doctype html>
<html lang="en" dir="ltr">
<head>
<title>Lab report explainer – MediBot</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e7c86">
<meta name="description" content="MediBot – a Groq-powered health information assistant for Pakistan. Trusted NHS/WHO-based answers in English and Urdu, symptom checker, medicine interactions, lab reports, nearby hospitals and reminders.">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/assets/img/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/assets/img/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Nastaliq+Urdu:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/app.css">
</head>
<body>
<div id="site-header"></div>
<main id="main">
<section class="section page-head">
  <div class="container"><span class="eyebrow" data-i="eyebrow"></span><h1 data-i="title"></h1><p class="lead" data-i="lead"></p></div>
</section>
<section class="section" style="padding-bottom:64px">
  <div class="container grid g2" style="align-items:start">
    <form class="card stack" id="labForm">
      <div class="field"><label for="txt" data-i="paste"></label><textarea id="txt" rows="9" data-ph="ph" required></textarea></div>
      <div class="field"><label for="file" data-i="upTitle"></label>
        <div class="drop" id="drop"><p class="small muted" data-i="upHint"></p>
          <div class="row"><button type="button" class="btn btn-ghost btn-sm" id="pick" data-i="upPick"></button><button type="button" class="btn btn-ghost btn-sm" id="camBtn" data-i="upCamera" hidden></button></div>
          <input type="file" id="file" accept="image/*,application/pdf,.heic,.heif" hidden><input type="file" id="cam" accept="image/*" capture="environment" hidden></div>
        <div class="file-prev" id="prev" hidden><img id="thumb" alt=""><span class="fp-ico" id="pdfIco">PDF</span>
          <div class="fp-meta"><b id="fname" dir="ltr"></b><span class="small muted" id="fsize" dir="ltr"></span></div><button type="button" class="btn btn-ghost btn-sm" id="rm" data-i="upRemove"></button></div>
        <p class="form-msg err" id="upErr" role="alert"></p>
        <p class="small muted" data-i="upPrivacy"></p></div>
      <div class="row"><div class="field" style="flex:1;min-width:160px"><label for="sex" data-i="sex"></label>
        <select id="sex"><option value="" data-i="sexAny"></option><option value="f" data-i="female"></option><option value="m" data-i="male"></option></select></div>
        <button type="button" class="btn btn-ghost btn-sm" id="sample" style="align-self:flex-end" data-i="sample"></button></div>
      <button class="btn" id="go" data-i="explain"></button>
      <p class="small muted" data-i="privacyNote"></p>
    </form>
    <div id="out" class="stack" aria-live="polite"><div class="card card-flat"><h3 data-i="supported"></h3><p class="small muted" id="supp"></p></div></div>
  </div>
</section>
</main>
<div id="site-footer"></div>
<script src="/assets/js/core.js" defer></script>
<script src="/assets/js/lab.js" defer></script>
</body>
</html>
