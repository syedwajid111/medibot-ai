<!doctype html>
<html lang="en" dir="ltr">
<head>
<title>AI Health Chat – MediBot</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e7c86">
<meta name="description" content="MediBot – a Groq-powered health information assistant for Pakistan. Trusted NHS/WHO-based answers in English and Urdu, symptom checker, medicine interactions, lab reports, nearby hospitals and reminders.">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/assets/img/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/assets/img/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Nastaliq+Urdu:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/app.css">
</head>
<body>
<div id="site-header"></div>
<main id="main">
<section class="section">
  <div class="container chat-page" id="chatPage">
    <aside class="card history" aria-label="Chat history">
      <button class="btn btn-block" id="newChat"><span data-i="newChat"></span></button>
      <label class="toggle"><input type="checkbox" id="private"><span data-i="private"></span></label>
      <p class="small muted" data-i="privateHelp" style="margin:0"></p>
      <h3 class="small muted" style="margin:8px 0 0" data-i="recent"></h3>
      <div class="history-list" id="history"></div>
    </aside>
    <div class="card chat" aria-label="MediBot chat">
      <div class="chat-head">
        <button class="icon-btn" id="histBtn" aria-label="History"></button>
        <span class="logo" id="chatLogo"></span>
        <div class="t"><strong>MediBot</strong><small id="engineLine" data-i="engineLine"></small></div>
        <button class="btn btn-ghost btn-sm" id="newChat2" data-i="new"></button>
      </div>
      <div class="log" id="log" aria-live="polite"></div>
      <div class="chips" id="chips"></div>
      <form class="composer" id="composer">
        <input id="msg" autocomplete="off" maxlength="1000" data-ph="placeholder" aria-label="Message">
        <button type="button" class="icon-btn" id="micBtn" hidden aria-label="Speak"></button>
        <button class="btn" type="submit" aria-label="Send" id="sendBtn"></button>
      </form>
    </div>
  </div>
</section>
</main>
<div id="site-footer"></div>
<script src="/assets/js/core.js" defer></script>
<script src="/assets/js/chat.js" defer></script>
</body>
</html>
